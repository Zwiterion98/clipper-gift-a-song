<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#3292b7">
    <title>CLIPPER — Configurar redirección</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/admin.js" defer></script>
  </head>

  <body>
    <main class="card">
      <div class="brand" aria-label="CLIPPER">
        <span class="crown" aria-hidden="true">♛</span>
        <span>Clipper</span>
      </div>

      <section id="loadingView" aria-live="polite">
        <p class="center muted">Cargando…</p>
      </section>

      <section id="loginView" hidden>
        <h1>Acceso privado</h1>
        <p class="intro">Ingresá la contraseña para administrar la redirección.</p>
        <form id="loginForm">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Ingresar</button>
          <p class="status" id="loginStatus" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section id="adminView" hidden>
        <h1>Redirección</h1>
        <p class="intro">Pegá la nueva URL de destino y aceptá para actualizarla.</p>
        <form id="redirectForm">
          <label for="destination">URL de destino</label>
          <input
            id="destination"
            name="destination"
            type="url"
            inputmode="url"
            autocomplete="url"
            placeholder="https://ejemplo.com"
            required
          >
          <button id="saveButton" type="submit">Aceptar</button>
          <p class="status" id="saveStatus" role="status" aria-live="polite"></p>
        </form>
        <button class="secondary" id="logoutButton" type="button">Cerrar sesión</button>
      </section>
    </main>
  </body>
</html>
